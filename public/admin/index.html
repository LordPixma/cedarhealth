<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Cedar Health — Website editor</title>
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <!-- ===== login ===== -->
  <div class="login" id="login">
    <form class="login__card" id="loginForm">
      <div class="login__brand">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 3c1.8 2.7 3 5 3 7.6 0 1-.2 1.9-.6 2.8 1.4-.8 2.4-2 3.1-3.6.6 2.6.3 5-1 7.2-.8 1.4-1.9 2.4-3.2 3.1V29h-2.6v-8.9c-1.3-.7-2.4-1.7-3.2-3.1-1.3-2.2-1.6-4.6-1-7.2.7 1.6 1.7 2.8 3.1 3.6-.4-.9-.6-1.8-.6-2.8C13 8 14.2 5.7 16 3Z" fill="#2f7d51"/></svg>
        <b>Cedar Health</b>
      </div>
      <h1>Website editor</h1>
      <p class="sub">Sign in to update your website.</p>
      <div class="f" style="margin-bottom:1rem">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" required />
      </div>
      <div class="f" style="margin-bottom:1.3rem">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required />
      </div>
      <button class="btn btn--block" type="submit" id="loginBtn">Sign in</button>
      <p id="loginErr" style="color:#b4472f;font-size:.9rem;margin:.9rem 0 0" hidden></p>
    </form>
  </div>

  <!-- ===== app ===== -->
  <div id="app" class="hidden">
    <div class="topbar">
      <span class="topbar__brand">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 3c1.8 2.7 3 5 3 7.6 0 1-.2 1.9-.6 2.8 1.4-.8 2.4-2 3.1-3.6.6 2.6.3 5-1 7.2-.8 1.4-1.9 2.4-3.2 3.1V29h-2.6v-8.9c-1.3-.7-2.4-1.7-3.2-3.1-1.3-2.2-1.6-4.6-1-7.2.7 1.6 1.7 2.8 3.1 3.6-.4-.9-.6-1.8-.6-2.8C13 8 14.2 5.7 16 3Z" fill="currentColor"/></svg>
        Cedar Health · Editor
      </span>
      <span class="topbar__spacer"></span>
      <a href="/" target="_blank" rel="noopener">View site ↗</a>
      <span class="who" id="whoami"></span>
      <a href="#" id="signout">Sign out</a>
    </div>
    <div class="layout">
      <nav class="sidebar" id="sidebar"></nav>
      <main class="main" id="main"></main>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/admin/admin.js" defer></script>
</body>
</html>
